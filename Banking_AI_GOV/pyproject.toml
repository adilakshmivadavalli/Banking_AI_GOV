[project]
name = "banking-ai-governance-demo"
version = "0.1.0"
description = "Local banking-agent scenarios with pre-tool prompt-injection defenses"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["agents", "banking_client", "demo", "pre_tool_hook", "tasks"]
